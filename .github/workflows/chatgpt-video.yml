name: Create MoneyPrinterTurbo video from ChatGPT

on:
  push:
    branches:
      - 'video-requests/**'
    paths:
      - 'video-request.json'

permissions:
  contents: read

jobs:
  render-video:
    if: github.repository == 'mohammedaabakhsh/moneyprinterturbo'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      UV_NO_PROGRESS: "1"
    steps:
      - name: Checkout the request branch
        uses: actions/checkout@v4

      - name: Install FFmpeg and Arabic fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.11'

      - name: Install MoneyPrinterTurbo
        run: uv sync --frozen --no-dev

      - name: Render video from the request file
        run: uv run --no-sync python scripts/chatgpt_video_bridge.py

      - name: Upload the video artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: moneyprinterturbo-video-${{ github.run_id }}
          path: storage/chatgpt-bridge/output/video.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Write job summary
        if: always()
        env:
          STATUS: ${{ job.status }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STATUS" = "success" ] && [ -n "$ARTIFACT_URL" ]; then
            printf '### Video completed\n[Download the MP4 artifact](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '### Video failed\nSee the [workflow logs](%s). No finished video was delivered.\n' "$RUN_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
